name: Assurance Harness

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Run tests
        run: |
          mkdir -p reports
          uv run pytest \
            --junitxml=reports/junit.xml \
            --html=reports/pytest.html --self-contained-html
      - name: Upload reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pytest-reports
          path: reports/
