name: Assurance Harness

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

# Opt all jobs into Node.js 24 ahead of GitHub's 2026-06-02 default switch.
# Some actions we depend on (e.g. actions/upload-artifact) have not yet
# published Node 24 majors. This env var is the GitHub-recommended bridge
# until they do.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Run tests
        run: |
          mkdir -p reports
          uv run pytest \
            --junitxml=reports/junit.xml \
            --html=reports/pytest.html --self-contained-html
      - name: Upload reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pytest-reports
          path: reports/
