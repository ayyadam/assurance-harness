name: Assurance Harness

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

# Opt all jobs into Node.js 24 ahead of GitHub's 2026-06-02 default switch.
# Some actions we depend on (e.g. actions/upload-artifact) have not yet
# published Node 24 majors. This env var is the GitHub-recommended bridge
# until they do.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Run tests
        run: |
          mkdir -p reports
          uv run pytest \
            --junitxml=reports/junit.xml \
            --html=reports/pytest.html --self-contained-html
      - name: Upload reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pytest-reports
          path: reports/

  contract:
    name: Contract Tests (Schemathesis)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - name: Check out the system under test (golf-web-app)
        uses: actions/checkout@v5
        with:
          repository: ayyadam/golf-web-app
          ref: develop
          path: sut
      - name: Build, start, and seed the SUT
        run: |
          cd sut
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/api/v1/openapi.json > /dev/null; then
              echo "SUT is up"; break
            fi
            echo "waiting for SUT to come up ($i/30)..."; sleep 2
          done
          docker compose exec -T web python seed.py
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Run contract tests
        env:
          SUT_BASE_URL: http://localhost:5000
        run: |
          mkdir -p reports
          uv run pytest contract/ \
            --junitxml=reports/contract-junit.xml \
            --html=reports/contract.html --self-contained-html
      - name: Upload contract reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: contract-test-reports
          path: reports/
      - name: Tear down SUT
        if: always()
        run: cd sut && docker compose down -v

  functional:
    name: Functional Tests (Playwright)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - name: Check out the system under test (golf-web-app)
        uses: actions/checkout@v5
        with:
          repository: ayyadam/golf-web-app
          ref: develop
          path: sut
      - name: Build, start, and seed the SUT
        run: |
          cd sut
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/ > /dev/null; then
              echo "SUT is up"; break
            fi
            echo "waiting for SUT to come up ($i/30)..."; sleep 2
          done
          docker compose exec -T web python seed.py
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium
      - name: Run functional tests
        env:
          SUT_BASE_URL: http://localhost:5000
        run: |
          mkdir -p reports
          uv run pytest functional/ \
            --junitxml=reports/functional-junit.xml \
            --html=reports/functional.html --self-contained-html \
            --screenshot=only-on-failure \
            --tracing=retain-on-failure \
            --output=reports/playwright-artifacts
      - name: Upload functional reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: functional-test-reports
          path: reports/
      - name: Tear down SUT
        if: always()
        run: cd sut && docker compose down -v
