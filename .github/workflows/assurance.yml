name: Assurance Harness

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  # B19 — reusable entry point: golf-web-app's pipeline calls this workflow to
  # assure its own PR/commit (shift-left). Harness self-runs (push/PR above) pass
  # no inputs, so every default below reproduces today's behaviour exactly.
  workflow_call:
    inputs:
      harness_ref:
        description: Ref of THIS harness repo to check out. Callers pin a tag/SHA; harness self-runs fall back to the triggering commit.
        type: string
        required: false
      sut_ref:
        description: Ref/SHA of golf-web-app to assure. Defaults to develop for harness self-runs.
        type: string
        required: false

# Opt all jobs into Node.js 24 ahead of GitHub's 2026-06-02 default switch.
# Some actions we depend on (e.g. actions/upload-artifact) have not yet
# published Node 24 majors. This env var is the GitHub-recommended bridge
# until they do.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.harness_ref && 'ayyadam/assurance-harness' || github.repository }}
          ref: ${{ inputs.harness_ref || github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    needs: lint
    # Harness-self job (tests the harness's own code) — skip when the SUT calls us.
    # NB: in a called reusable workflow github.event_name is the CALLER's event
    # (e.g. pull_request), never 'workflow_call' — so detect a call via an input
    # the caller always sets. Empty harness_ref == a harness self-run.
    if: ${{ inputs.harness_ref == '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Run tests
        run: |
          mkdir -p reports
          uv run pytest \
            --junitxml=reports/junit.xml \
            --html=reports/pytest.html --self-contained-html
      - name: Upload reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pytest-reports
          path: reports/

  contract:
    name: Contract Tests (Schemathesis)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.harness_ref && 'ayyadam/assurance-harness' || github.repository }}
          ref: ${{ inputs.harness_ref || github.sha }}
      - name: Check out the system under test (golf-web-app)
        uses: actions/checkout@v5
        with:
          repository: ayyadam/golf-web-app
          ref: ${{ inputs.sut_ref || 'develop' }}
          path: sut
      - name: Build, start, and seed the SUT
        run: |
          cd sut
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/api/v1/openapi.json > /dev/null; then
              echo "SUT is up"; break
            fi
            echo "waiting for SUT to come up ($i/30)..."; sleep 2
          done
          docker compose exec -T web python seed.py
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Contract gate + evidence (Schemathesis CLI)
        env:
          SUT_BASE_URL: http://localhost:5000
        # One run that gates AND reports: the Schemathesis CLI fuzzes every
        # operation and follows the OpenAPI links (stateful phase), exits non-zero
        # on any contract violation, and writes a per-operation summary + JUnit +
        # VCR cassette into reports/ (uploaded below). Replaces the former split
        # of a thin pytest wrapper (gate) beside an advisory CLI run (report).
        run: |
          mkdir -p reports
          uv run python -m contract.evidence --report-dir reports
      - name: Upload contract reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: contract-test-reports
          path: reports/
      - name: Tear down SUT
        if: always()
        run: cd sut && docker compose down -v

  functional:
    name: Functional Tests (Playwright)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.harness_ref && 'ayyadam/assurance-harness' || github.repository }}
          ref: ${{ inputs.harness_ref || github.sha }}
      - name: Check out the system under test (golf-web-app)
        uses: actions/checkout@v5
        with:
          repository: ayyadam/golf-web-app
          ref: ${{ inputs.sut_ref || 'develop' }}
          path: sut
      - name: Build, start, and seed the SUT
        run: |
          cd sut
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/ > /dev/null; then
              echo "SUT is up"; break
            fi
            echo "waiting for SUT to come up ($i/30)..."; sleep 2
          done
          docker compose exec -T web python seed.py
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium
      - name: Run functional tests
        env:
          SUT_BASE_URL: http://localhost:5000
        # B19 flake guard: retry ONLY on transient TimeoutError (the R-018
        # booking-confirm race), never on assertion failures — so a required
        # gate doesn't block legitimate SUT PRs, while real defects still fail
        # fast. A retry-only pass is reported as rerun, not hidden. Mirrors the
        # TS layer's retries:2 (playwright.config.ts).
        run: |
          mkdir -p reports
          uv run pytest functional/ \
            --reruns 2 --reruns-delay 1 --only-rerun TimeoutError \
            --junitxml=reports/functional-junit.xml \
            --html=reports/functional.html --self-contained-html \
            --screenshot=only-on-failure \
            --tracing=retain-on-failure \
            --output=reports/playwright-artifacts
      - name: Upload functional reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: functional-test-reports
          path: reports/
      - name: Tear down SUT
        if: always()
        run: cd sut && docker compose down -v

  e2e-ts:
    name: E2E (Playwright / TypeScript)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.harness_ref && 'ayyadam/assurance-harness' || github.repository }}
          ref: ${{ inputs.harness_ref || github.sha }}
      - name: Check out the system under test (golf-web-app)
        uses: actions/checkout@v5
        with:
          repository: ayyadam/golf-web-app
          ref: ${{ inputs.sut_ref || 'develop' }}
          path: sut
      - name: Build, start, and seed the SUT
        run: |
          cd sut
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/ > /dev/null; then
              echo "SUT is up"; break
            fi
            echo "waiting for SUT to come up ($i/30)..."; sleep 2
          done
          docker compose exec -T web python seed.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e_ts/package-lock.json
      - name: Install dependencies
        run: cd e2e_ts && npm ci
      - name: Install Playwright browser
        run: cd e2e_ts && npx playwright install --with-deps chromium
      - name: Run TypeScript E2E tests
        env:
          SUT_BASE_URL: http://localhost:5000
        run: cd e2e_ts && npm test
      - name: Upload E2E reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-ts-reports
          path: |
            e2e_ts/reports/
            e2e_ts/test-results/
      - name: Tear down SUT
        if: always()
        run: cd sut && docker compose down -v

  accessibility:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.harness_ref && 'ayyadam/assurance-harness' || github.repository }}
          ref: ${{ inputs.harness_ref || github.sha }}
      - name: Check out the system under test (golf-web-app)
        uses: actions/checkout@v5
        with:
          repository: ayyadam/golf-web-app
          ref: ${{ inputs.sut_ref || 'develop' }}
          path: sut
      - name: Build, start, and seed the SUT
        run: |
          cd sut
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/ > /dev/null; then
              echo "SUT is up"; break
            fi
            echo "waiting for SUT to come up ($i/30)..."; sleep 2
          done
          docker compose exec -T web python seed.py
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium
      - name: Run accessibility sweep
        env:
          SUT_BASE_URL: http://localhost:5000
        run: |
          mkdir -p nonfunctional/reports
          uv run pytest nonfunctional/accessibility/ \
            --junitxml=nonfunctional/reports/a11y-junit.xml \
            --html=nonfunctional/reports/a11y.html --self-contained-html
      - name: Upload accessibility reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: accessibility-reports
          path: nonfunctional/reports/
      - name: Tear down SUT
        if: always()
        run: cd sut && docker compose down -v

  performance:
    name: Performance (k6)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.harness_ref && 'ayyadam/assurance-harness' || github.repository }}
          ref: ${{ inputs.harness_ref || github.sha }}
      - name: Check out the system under test (golf-web-app)
        uses: actions/checkout@v5
        with:
          repository: ayyadam/golf-web-app
          ref: ${{ inputs.sut_ref || 'develop' }}
          path: sut
      - name: Build, start, and seed the SUT
        run: |
          cd sut
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/ > /dev/null; then
              echo "SUT is up"; break
            fi
            echo "waiting for SUT to come up ($i/30)..."; sleep 2
          done
          docker compose exec -T web python seed.py
      - name: Install k6
        uses: grafana/setup-k6-action@v1
      - name: Run k6 load test
        env:
          SUT_BASE_URL: http://localhost:5000
        run: |
          mkdir -p nonfunctional/reports/perf
          k6 run nonfunctional/performance/api_load.js
      - name: Upload performance reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: performance-reports
          path: nonfunctional/reports/
      - name: Tear down SUT
        if: always()
        run: cd sut && docker compose down -v

  data-quality:
    name: Data Quality (pandera)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.harness_ref && 'ayyadam/assurance-harness' || github.repository }}
          ref: ${{ inputs.harness_ref || github.sha }}
      - name: Check out the system under test (golf-web-app)
        uses: actions/checkout@v5
        with:
          repository: ayyadam/golf-web-app
          ref: ${{ inputs.sut_ref || 'develop' }}
          path: sut
      - name: Build, start, and seed the SUT
        run: |
          cd sut
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/ > /dev/null; then
              echo "SUT is up"; break
            fi
            echo "waiting for SUT to come up ($i/30)..."; sleep 2
          done
          docker compose exec -T web python seed.py
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Run data-quality checks
        env:
          SUT_DB_URL: postgresql+psycopg2://agc_user:agc_pass@localhost:5432/agc_db
        run: |
          mkdir -p reports
          uv run pytest data_quality/ \
            --junitxml=reports/data-quality-junit.xml \
            --html=reports/data-quality.html --self-contained-html
      - name: Upload data-quality reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: data-quality-reports
          path: reports/
      - name: Tear down SUT
        if: always()
        run: cd sut && docker compose down -v

  security:
    name: Security (SAST/SCA/secrets)
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write   # upload gitleaks SARIF to the code-scanning / Security tab
    steps:
      # Static scans only — no running SUT needed (no docker build/seed).
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.harness_ref && 'ayyadam/assurance-harness' || github.repository }}
          ref: ${{ inputs.harness_ref || github.sha }}
          fetch-depth: 0   # full history for gitleaks
      - name: Check out the system under test (golf-web-app)
        uses: actions/checkout@v5
        with:
          repository: ayyadam/golf-web-app
          ref: ${{ inputs.sut_ref || 'develop' }}
          path: sut
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Security scan (Bandit SAST + pip-audit SCA + gitleaks secrets)
        run: uv run python nonfunctional/security/scan.py --sut sut
      # Each gitleaks SARIF is uploaded under its OWN category: code scanning
      # rejects multiple SARIF runs sharing a category (GitHub, 2025-07-21), and
      # the scan emits one run per role (harness + sut). The gate is the scan
      # step above; these Security-tab uploads are best-effort.
      - name: Upload harness secret-scan SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: nonfunctional/security/reports/gitleaks-harness.sarif
          category: gitleaks-harness
      - name: Upload SUT secret-scan SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: nonfunctional/security/reports/gitleaks-sut.sarif
          category: gitleaks-sut
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: security-reports
          path: nonfunctional/security/reports/

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    needs: lint
    # Harness-self job (analyses the harness's own Python) — skip on SUT calls.
    # NB: in a called reusable workflow github.event_name is the CALLER's event
    # (e.g. pull_request), never 'workflow_call' — so detect a call via an input
    # the caller always sets. Empty harness_ref == a harness self-run.
    if: ${{ inputs.harness_ref == '' }}
    permissions:
      contents: read
      security-events: write
    steps:
      # CodeQL analyses the harness's own Python (deep dataflow SAST of the
      # assurance code); Bandit covers the SUT in the security job above.
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql-python

  dast:
    name: Security — DAST (ZAP baseline)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.harness_ref && 'ayyadam/assurance-harness' || github.repository }}
          ref: ${{ inputs.harness_ref || github.sha }}
      - name: Check out the system under test (golf-web-app)
        uses: actions/checkout@v5
        with:
          repository: ayyadam/golf-web-app
          ref: ${{ inputs.sut_ref || 'develop' }}
          path: sut
      - name: Build, start, and seed the SUT
        run: |
          cd sut
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/ > /dev/null; then
              echo "SUT is up"; break
            fi
            echo "waiting for SUT to come up ($i/30)..."; sleep 2
          done
          docker compose exec -T web python seed.py
      - name: ZAP baseline scan (advisory)
        run: |
          # Passive spider + passive scan only (no active attacks). --network host
          # lets the ZAP container reach the SUT on the runner's localhost:5000.
          # -I = informational (don't fail on warnings); '|| true' keeps it advisory.
          mkdir -p reports && chmod 777 reports
          docker run --network host -v "$(pwd)/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:5000 -I \
            -r zap-report.html -J zap-report.json -w zap-report.md || true
          echo "ZAP baseline complete (advisory — see artifact)"
      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dast-zap-report
          path: reports/
      - name: Tear down SUT
        if: always()
        run: cd sut && docker compose down -v
