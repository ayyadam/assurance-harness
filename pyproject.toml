[project]
name = "assurance-harness"
version = "0.1.0"
description = "Assurance harness targeting golf-web-app — an automation-led quality-engineering portfolio demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-html>=4.1",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "schemathesis>=4.20.2",
    "requests>=2.34.2",
    "pytest-playwright>=0.5",
    "playwright>=1.49",
    "axe-playwright-python>=0.1.4",
    "pandera[pandas]>=0.20",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0.3",
    "ollama>=0.6.2",
    "bandit>=1.9.4",
    "pip-audit>=2.10.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"
