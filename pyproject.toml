[project]
name = "testing-system"
version = "0.1.0"
description = "Assurance harness for golf-web-app — Digital Assurance Engineer portfolio demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-html>=4.1",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "schemathesis>=4.20.2",
    "requests>=2.34.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
