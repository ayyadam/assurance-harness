# Local observability stack — Prometheus + Grafana scraping the SUT's
# /metrics endpoint (provisioned by golf-web-app PR #13).
#
# Bring up:
#   1. First start the SUT (separate compose in ../golf-web-app):
#        cd ../golf-web-app && docker compose up -d
#   2. Then this stack:
#        docker compose up -d
#   3. Grafana at http://localhost:3000 (admin / admin), Prometheus at
#      http://localhost:9090.
#
# The two stacks run independently. Prometheus scrapes the SUT via
# host.docker.internal:5000 — the host gateway — so we don't need to share
# a compose network with the SUT or hardcode an internal hostname. Works
# identically on Linux runner CI (extra_hosts maps host.docker.internal).

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: assurance-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:11.4.0
    container_name: assurance-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  prometheus-data:
  grafana-data:
